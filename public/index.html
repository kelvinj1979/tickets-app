<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Boletos - Fiesta (v1.1.0)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Encabezado con versión y enlace al escáner -->
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-6 rounded-xl shadow-sm">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-bold text-gray-800">🎟️ Control de Boletos - Fiesta</h1>
          <span class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full border border-blue-200">v1.1.0</span>
        </div>
        <p class="text-sm text-gray-500 mt-1">Emisión de entradas y control de acceso por QR</p>
      </div>
      <a href="/scanner.html" target="_blank" class="w-full sm:w-auto text-center bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-lg font-medium shadow transition">
        Abrir Escáner 📷
      </a>
    </div>

    <!-- Formulario para emitir boleto -->
    <div class="bg-white p-6 rounded-xl shadow-sm">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">Emitir Nuevo Boleto</h2>
      
      <!-- Mensaje de notificación -->
      <div id="alertMsg" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

      <form id="formTicket" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <input type="text" id="guest_name" placeholder="Nombre completo del invitado *" required class="border p-2.5 rounded-lg col-span-1 md:col-span-2 focus:ring-2 focus:ring-blue-500 outline-none">
        <input type="email" id="email" placeholder="Correo (opcional)" class="border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <input type="number" id="quantity" value="1" min="1" placeholder="Cant." class="border p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <button type="submit" id="btnSubmit" class="bg-blue-600 hover:bg-blue-700 text-white py-2.5 px-4 rounded-lg font-medium col-span-1 md:col-span-4 transition shadow flex items-center justify-center gap-2">
          <span>Generar Boleto con QR</span>
        </button>
      </form>
    </div>

    <!-- Lista de boletos emitidos -->
    <div class="bg-white p-6 rounded-xl shadow-sm overflow-x-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-gray-700">Boletos Registrados</h2>
        <span id="ticketCountBadge" class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-medium">0 boletos</span>
      </div>

      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b text-gray-500 text-sm">
            <th class="py-3">Código</th>
            <th>Invitado</th>
            <th>Cant.</th>
            <th>Estado</th>
            <th>Acciones / Compartir</th>
          </tr>
        </thead>
        <tbody id="ticketsList" class="divide-y text-gray-700 text-sm">
          <tr>
            <td colspan="5" class="py-4 text-center text-gray-400">Cargando boletos...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Modal: Ver Boleto y Opciones de Compartir (WhatsApp / Email / Descargar) -->
  <div id="ticketModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center relative animate-fade-in">
      
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      
      <h3 class="text-xl font-bold text-gray-800">🎟️ Boleto de Entrada</h3>
      
      <!-- Contenedor Imagen QR -->
      <div class="bg-gray-50 p-4 rounded-xl border flex flex-col items-center">
        <img id="modalQrImg" src="" alt="Código QR" class="w-44 h-44 rounded-lg shadow-sm border">
        <p id="modalTicketId" class="font-mono font-bold text-lg text-gray-800 mt-2"></p>
      </div>

      <!-- Datos del Invitado -->
      <div class="text-left bg-gray-50 p-3 rounded-lg border text-sm space-y-1">
        <p><strong>Invitado:</strong> <span id="modalGuestName"></span></p>
        <p><strong>Personas:</strong> <span id="modalQuantity"></span></p>
        <p><strong>Correo:</strong> <span id="modalEmail"></span></p>
        <p><strong>Estado:</strong> <span id="modalStatusBadge"></span></p>
      </div>

      <!-- Botones de Compartir -->
      <div class="space-y-2 pt-2">
        <button onclick="shareWhatsApp()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2 shadow">
          <span>📲 Compartir por WhatsApp</span>
        </button>

        <button onclick="shareEmail()" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2 shadow">
          <span>✉️ Compartir por Email</span>
        </button>

        <button onclick="shareNative()" id="nativeShareBtn" class="w-full bg-gray-800 hover:bg-gray-900 text-white py-2.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2 shadow">
          <span>🔗 Compartir (Menú del Celular)</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let currentTicket = null;
    let allTicketsList = [];

    // Cargar la lista de boletos desde la BD
    async function loadTickets() {
      try {
        const res = await fetch(`${API_BASE}/api/tickets`);
        
        if (!res.ok) {
          throw new Error(`Respuesta del servidor HTTP ${res.status} ${res.statusText}`);
        }

        allTicketsList = await res.json();
        const tbody = document.getElementById('ticketsList');
        document.getElementById('ticketCountBadge').textContent = `${allTicketsList.length} boletos`;

        if (allTicketsList.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="py-6 text-center text-gray-400">
                No hay boletos registrados aún. Ingresa un nombre para emitir el primero.
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = '';
        allTicketsList.forEach(t => {
          const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(t.id)}&size=200`;
          const badgeColor = t.status === 'VALID' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
          const badgeText = t.status === 'VALID' ? 'Válido' : 'Ingresado';

          tbody.innerHTML += `
            <tr class="hover:bg-gray-50">
              <td class="py-3 font-mono font-bold text-gray-900">${t.id}</td>
              <td class="font-medium text-gray-800">${escapeHtml(t.guest_name)}</td>
              <td>${t.quantity}</td>
              <td><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${badgeText}</span></td>
              <td>
                <div class="flex items-center gap-2">
                  <button onclick="openModal('${t.id}')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1 rounded-lg text-xs font-semibold flex items-center gap-1">
                    👁️ Ver / QR
                  </button>
                  <button onclick="quickShareWhatsApp('${t.id}')" class="bg-emerald-50 text-emerald-600 hover:bg-emerald-100 px-2.5 py-1 rounded-lg text-xs font-semibold" title="Enviar por WhatsApp">
                    📲 WhatsApp
                  </button>
                </div>
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error('Error al cargar boletos:', err);
        const tbody = document.getElementById('ticketsList');
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-4 text-center text-red-500 font-medium">
              ⚠️ ${err.message}. Verifica que el servidor Node.js esté corriendo.
            </td>
          </tr>
        `;
      }
    }

    // Guardar nuevo boleto en la BD
    document.getElementById('formTicket').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.innerText = 'Guardando en BD...';

      const body = {
        guest_name: document.getElementById('guest_name').value.trim(),
        email: document.getElementById('email').value.trim(),
        quantity: document.getElementById('quantity').value
      };

      try {
        const res = await fetch(`${API_BASE}/api/tickets`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errText || res.statusText}`);
        }

        const data = await res.json();

        if (data.success && data.ticket) {
          showAlert('✅ ¡Boleto generado y guardado exitosamente!', 'success');
          document.getElementById('formTicket').reset();
          
          await loadTickets();
          openModal(data.ticket.id);
        } else {
          showAlert('❌ Error: ' + (data.error || 'No se pudo crear el boleto'), 'error');
        }
      } catch (err) {
        console.error('Error enviando boleto:', err);
        showAlert('❌ Error de conexión al servidor: ' + err.message, 'error');
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerText = 'Generar Boleto con QR';
      }
    });

    // Abrir Modal de Boleto
    function openModal(ticketId) {
      const ticket = allTicketsList.find(t => t.id === ticketId);
      if (!ticket) return;

      currentTicket = ticket;
      const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(ticket.id)}&size=250`;

      document.getElementById('modalQrImg').src = qrUrl;
      document.getElementById('modalTicketId').textContent = ticket.id;
      document.getElementById('modalGuestName').textContent = ticket.guest_name;
      document.getElementById('modalQuantity').textContent = `${ticket.quantity} persona(s)`;
      document.getElementById('modalEmail').textContent = ticket.email || 'No proporcionado';

      const statusBadge = document.getElementById('modalStatusBadge');
      if (ticket.status === 'VALID') {
        statusBadge.className = 'px-2 py-0.5 rounded text-xs font-semibold bg-green-100 text-green-700';
        statusBadge.textContent = 'Válido para Ingreso';
      } else {
        statusBadge.className = 'px-2 py-0.5 rounded text-xs font-semibold bg-red-100 text-red-700';
        statusBadge.textContent = 'Ya Ingresado';
      }

      document.getElementById('ticketModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('ticketModal').classList.add('hidden');
    }

    // Compartir por WhatsApp
    function shareWhatsApp() {
      if (!currentTicket) return;
      quickShareWhatsApp(currentTicket.id);
    }

    function quickShareWhatsApp(ticketId) {
      const t = allTicketsList.find(x => x.id === ticketId);
      if (!t) return;

      const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(t.id)}&size=250`;
      const mensaje = `Hola *${t.guest_name}*, aquí tienes tu boleto de entrada a la Fiesta 🎟️:\n\n` +
                      `• Código de Boleto: *${t.id}*\n` +
                      `• Pases: *${t.quantity} persona(s)*\n` +
                      `• Ver Código QR de Entrada: ${qrUrl}\n\n` +
                      `¡Preséntalo en la puerta para ingresar! 🎉`;

      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
      window.open(waUrl, '_blank');
    }

    // Compartir por Email
    function shareEmail() {
      if (!currentTicket) return;
      const t = currentTicket;
      const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(t.id)}&size=250`;
      
      const asunto = `Tu Boleto de Entrada - ${t.guest_name}`;
      const cuerpo = `Hola ${t.guest_name},\n\n` +
                     `Aquí tienes los detalles de tu boleto de entrada para la Fiesta:\n\n` +
                     `• Código de Boleto: ${t.id}\n` +
                     `• Cantidad de Pases: ${t.quantity}\n` +
                     `• Ver tu Código QR: ${qrUrl}\n\n` +
                     `Presenta este código en la entrada para ingresar.\n\n¡Te esperamos!`;

      const mailtoUrl = `mailto:${t.email || ''}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
      window.location.href = mailtoUrl;
    }

    // Compartir mediante el menú nativo del celular
    async function shareNative() {
      if (!currentTicket) return;
      const t = currentTicket;
      const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(t.id)}&size=250`;
      
      const textData = `Hola ${t.guest_name}, aquí está tu boleto de entrada (${t.id}). Abre tu código QR aquí: ${qrUrl}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Boleto de Entrada',
            text: textData,
            url: qrUrl
          });
        } catch (err) {
          console.log('Compartir cancelado o no soportado:', err);
        }
      } else {
        shareWhatsApp();
      }
    }

    // Mostrar alerta temporal
    function showAlert(msg, type) {
      const box = document.getElementById('alertMsg');
      box.textContent = msg;
      box.className = `mb-4 p-3 rounded-lg text-sm font-medium ${type === 'success' ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-red-100 text-red-800 border border-red-200'}`;
      box.classList.remove('hidden');

      setTimeout(() => {
        box.classList.add('hidden');
      }, 5000);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Cargar boletos al iniciar
    loadTickets();
  </script>
</body>
</html>
